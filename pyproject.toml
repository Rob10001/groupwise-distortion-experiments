[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "empirical-testing"
version = "0.2.0"
description = "Coffee and synthetic Persona experiments for groupwise preference learning"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
  {name = "Jacob Brodkey"},
  {name = "Roberto Tamez"},
  {name = "Aaron Roth"},
]
# Tested on Python 3.12 with the exact versions in requirements.txt. The dependency
# minimums below are untested lower bounds; use requirements.txt for reproduction.
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
  "matplotlib>=3.8",
  # The CPU kernels were validated with exactly these compiler versions.
  "numba==0.67.0",
  "llvmlite==0.49.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/Rob10001/groupwise-distortion-experiments"
Paper = "https://arxiv.org/abs/2610.05450"

[tool.setuptools.packages.find]
where = ["src"]
include = ["empirical_testing*"]

[tool.pytest.ini_options]
# Tests import the packages straight from the checkout; installing the project is optional.
pythonpath = ["src"]
testpaths = ["tests"]
